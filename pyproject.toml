[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "longdoc-qa"
dynamic = ["version"]
description = "Dependency-free SDK, CLI and HTTP API for cited question answering over long documents: parent-child retrieval, built-in PDF reader and answer engine, optional Claude / OpenAI / local models."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "rahpalrah" }]
keywords = ["claude", "anthropic", "rag", "retrieval", "prompt-caching", "llm", "document-qa"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = []  # the core, CLI, HTTP server, PDF reader and answer engine use only the standard library

[project.optional-dependencies]
# Everything below is optional. Nothing in the default install needs a third-party package.
pdf = ["pypdf>=5"]                       # alternative PDF reader (the built-in one is the default)
fastapi = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "python-multipart>=0.0.9"]
server = ["longdoc-qa[fastapi]"]         # kept for older instructions
local = ["llama-cpp-python>=0.3"]        # run a GGUF model on this machine
all = ["longdoc-qa[pdf,fastapi]"]
dev = [
    "longdoc-qa[pdf,fastapi]",
    "fpdf2>=2.7",
    "httpx>=0.27",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "ruff>=0.8",
    "mypy>=1.13",
]

[project.scripts]
longdoc = "longdoc.cli:main"

[project.urls]
Documentation = "https://github.com/rahpalrah/lost-in-the-middle#readme"
Issues = "https://github.com/rahpalrah/lost-in-the-middle/issues"
Source = "https://github.com/rahpalrah/lost-in-the-middle"

[tool.hatch.version]
path = "src/longdoc/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/longdoc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["longdoc"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 85

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "N", "C4", "PT", "RET", "D"]
ignore = ["D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "E501"]
"tests/test_server.py" = ["D", "E501", "E402"]
"examples/**" = ["D"]
"benchmarks/**" = ["D", "E501", "N818"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["pypdf.*", "fpdf.*", "llama_cpp.*", "reportlab.*"]
ignore_missing_imports = true
