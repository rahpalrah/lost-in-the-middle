name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest --cov

  zero-deps:
    # The default install must work with nothing but the standard library.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - run: pip install pytest pytest-asyncio && pip install --no-deps -e .
      - run: pip list --format=freeze | grep -v -i "^\(longdoc-qa\|pip\|setuptools\|wheel\|pytest\|pluggy\|iniconfig\|packaging\|pygments\|exceptiongroup\|tomli\|typing_extensions\)" && exit 1 || true
      - run: pytest -q
      - run: longdoc --version
      - name: Answer a question with no key and no packages
        run: |
          printf '# 1. Term\n\nThe term is thirty-six (36) months.\n\n# 2. Law\n\nNew York law governs.\n' > c.md
          longdoc ask c.md "How long is the term?" | tee out.txt
          grep -q "thirty-six" out.txt

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]" bandit pip-audit
      - run: bandit -q -r src
      - run: pip-audit --local --skip-editable

  build:
    runs-on: ubuntu-latest
    needs: [lint, test, security]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
